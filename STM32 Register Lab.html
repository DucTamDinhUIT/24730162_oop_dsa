<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STM32 Register Lab</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--tx:#0f172a;--mut:#64748b;--bd:#d6dde8;--ac:#0369a1;--on:#16a34a;--off:#e2e8f0;--chg:#f59e0b;--code:#f1f5f9;--ok:#15803d;--er:#dc2626;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1120;--card:#1e293b;--tx:#f8fafc;--mut:#94a3b8;--bd:#334155;--ac:#38bdf8;--on:#22c55e;--off:#334155;--code:#030712;--ok:#4ade80;--er:#f87171}}
:root[data-theme="dark"]{--bg:#0b1120;--card:#1e293b;--tx:#f8fafc;--mut:#94a3b8;--bd:#334155;--ac:#38bdf8;--on:#22c55e;--off:#334155;--code:#030712;--ok:#4ade80;--er:#f87171}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px ui-monospace,Menlo,Consolas,monospace;padding:16px}
.w{max-width:960px;margin:0 auto;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px}
h1{font-size:18px;margin:0 0 12px;color:var(--ac)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
select,button,textarea{font:inherit;color:var(--tx);background:var(--code);border:1px solid var(--bd);border-radius:6px;padding:7px 10px}
button{cursor:pointer;background:var(--off)}button.p{background:var(--ac);color:#fff;border:0;font-weight:700}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin:10px 0}
.st div{background:var(--code);border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
.st small{display:block;color:var(--mut);font-size:11px}.st b{color:var(--ac);word-break:break-all}
.sc{overflow-x:auto;padding-bottom:4px}
.g{display:grid;grid-template-columns:repeat(32,minmax(22px,1fr));gap:2px;min-width:760px}
.g16{display:grid;grid-template-columns:repeat(16,minmax(44px,1fr));gap:2px;min-width:760px;margin-top:6px}
.h{text-align:center;font-size:10px;color:var(--mut)}
.b{text-align:center;padding:6px 0;border-radius:4px;background:var(--off);font-weight:700;cursor:pointer;user-select:none}
.b.on{background:var(--on);color:#fff}.b.chg{outline:2px solid var(--chg)}
.f{text-align:center;font-size:11px;padding:3px 0;border-radius:4px;background:var(--code);border:1px solid var(--bd)}
.f.chg{outline:2px solid var(--chg)}
textarea{width:100%;box-sizing:border-box;min-height:140px;resize:vertical;line-height:1.5}
#log{background:var(--code);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;max-height:170px;overflow:auto;font-size:12px;color:var(--mut)}
.ok{color:var(--ok)}.er{color:var(--er)}.wr{color:var(--chg)}
#tg{color:var(--mut);font-size:12px}
</style>
</head>
<body>
<div class="w">
<h1>STM32 Register Lab</h1>
<div class="row">
  <label>Thanh ghi đang xem: <select id="sel" onchange="cur=this.value;mask=0;draw()"></select></label>
  <label><input type="checkbox" id="f2" onchange="draw()"> Xem theo trường 2 bit (kiểu MODER)</label>
</div>
<div class="st"><div><small>HEX</small><b id="hex"></b></div><div><small>BIN</small><b id="bin"></b></div><div><small>DEC (unsigned)</small><b id="dec"></b></div></div>
<div class="sc"><div class="g" id="hd"></div><div class="g" id="bits"></div><div class="g16" id="fl"></div></div>
<div id="tg"></div>
<div class="row">
  <label>Chế độ: <select id="ch" onchange="pick()"></select></label>
  <span id="hint" style="color:var(--mut)"></span>
</div>
<textarea id="code" spellcheck="false"></textarea>
<div class="row">
  <button class="p" onclick="runAll()">▶ Chạy tất cả</button>
  <button onclick="stepOne()">⏭ Từng lệnh</button>
  <button onclick="pick()">↺ Reset</button>
  <span style="color:var(--mut)">Mẫu:</span><span id="sn" class="row" style="margin:0"></span>
</div>
<div id="log"></div>
<p style="color:var(--mut);font-size:12px;margin:10px 0 0">Hỗ trợ: <code>= |= &amp;= ^= &lt;&lt;= &gt;&gt;= += -=</code>, toán tử <code>~ ! | &amp; ^ &lt;&lt; &gt;&gt; + - * / %</code>, <code>0x</code>, <code>0b</code>, hậu tố <code>U</code>, <code>#define</code>, <code>uint32_t x = ...;</code>. Biểu thức đơn lẻ (vd <code>REG &amp; (REG - 1)</code>) sẽ in kết quả. Bấm vào ô bit để đảo bit bằng tay.</p>
</div>
<script>
const $=id=>document.getElementById(id);
const PRE={'REG':0,'GPIOG->MODER':0,'RCC->AHB1ENR':0x00100000,'USART1->CR1':0,'SPI1->CR1':0};
const CH=[
 {t:'1. GPIOG->MODER: PG13 thành Output (01b)',r:'GPIOG->MODER',s:0,g:0x04000000,h:'1U << (13*2)'},
 {t:'2. MODER = 0xFFFFFFFF: đổi riêng PG13 thành AF (10b)',r:'GPIOG->MODER',s:0xFFFFFFFF,g:0xFBFFFFFF,h:'xóa 2 bit rồi OR giá trị mới'},
 {t:'3. AHB1ENR: bật GPIOA, GPIOG, giữ nguyên bit 20',r:'RCC->AHB1ENR',s:0x00100000,g:0x00100041,h:'GPIOAEN bit 0, GPIOGEN bit 6'},
 {t:'4. USART1->CR1: bật UE (13), TE (3), RE (2)',r:'USART1->CR1',s:0,g:0x200C,h:'dùng |='},
 {t:'5. SPI1->CR1: MSTR, BR=011, SSM, SSI, SPE',r:'SPI1->CR1',s:0,g:0x35C,h:'MSTR=2, BR=5:3, SPE=6, SSI=8, SSM=9'},
 {t:'6. Xóa bit 1 thấp nhất: 101100b → 101000b',r:'REG',s:0x2C,g:0x28,h:'n & (n - 1)'},
 {t:'7. Giữ lại đúng bit 1 thấp nhất: 0xF0 → 0x10',r:'REG',s:0xF0,g:0x10,h:'n & -n'},
 {t:'8. Đảo 8 bit thấp bằng XOR: 0xA5 → 0x5A',r:'REG',s:0xA5,g:0x5A,h:'^= 0xFF'},
 {t:'9. Trích trường bit [15:8]: 0x12345678 → 0x56',r:'REG',s:0x12345678,g:0x56,h:'(n >> 8) & 0xFF'}];
const SN=[
 ['Xóa bit thấp nhất','REG = 0b101100;\nREG &= REG - 1;'],
 ['Cô lập bit thấp nhất','REG = 0xF0;\nREG = REG & -REG;'],
 ['Lũy thừa của 2?','REG = 64;\nREG & (REG - 1)   // 0 nghĩa là đúng'],
 ['Hoán đổi XOR','uint32_t a = 5;\nuint32_t b = 9;\na ^= b;\nb ^= a;\na ^= b;'],
 ['#define pin','#define PIN 13\nGPIOG->MODER &= ~(3U << (PIN * 2));\nGPIOG->MODER |= (1U << (PIN * 2));'],
 ['UB: 1 << 31','REG = 1 << 31;'],
 ['UB: dịch 32','REG = 1U << 32;']];
let vars,defs,cur='REG',mask=0,step=0,W=[],P={'|':1,'^':2,'&':3,'<<':4,'>>':4,'+':5,'-':5,'*':6,'/':6,'%':6};
const h8=v=>(v>>>0).toString(16).toUpperCase().padStart(8,'0');
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function tok(s){const t=[],re=/\s*(0[xX][0-9a-fA-F]+[uUlL]*|0[bB][01]+[uUlL]*|\d+[uUlL]*|[A-Za-z_]\w*(?:->[A-Za-z_]\w*)*|<<=|>>=|<<|>>|\|=|&=|\^=|\+=|-=|[-+*\/%&|^~!()=])/y;s=s.trim();let p=0,m;
 while(p<s.length){re.lastIndex=p;m=re.exec(s);if(!m)throw Error('Ký tự lạ: “'+s[p]+'”');t.push(m[1]);p=re.lastIndex}return t}
function bin(o,a,b){const u=a.u||b.u;let v;
 switch(o){case'|':v=a.v|b.v;break;case'&':v=a.v&b.v;break;case'^':v=a.v^b.v;break;case'+':v=a.v+b.v;break;case'-':v=a.v-b.v;break;case'*':v=Math.imul(a.v,b.v);break;
 case'/':case'%':if(!b.v)throw Error('Chia cho 0');v=o=='/'?Math.floor(a.v/b.v):a.v%b.v;break;
 case'<<':case'>>':if(b.v>=32){W.push('Dịch '+b.v+' bit (≥ 32) là hành vi không xác định (UB) trong C; JS/CPU có thể cho kết quả khác nhau');v=0}
  else{if(o=='<<'&&!a.u&&a.v*2**b.v>=2**31)W.push('Dịch trái số int có dấu làm tràn bit 31 là UB; hãy dùng 1U');v=o=='<<'?a.v<<b.v:a.v>>>b.v}
  return{v:v>>>0,u:a.u}}
 return{v:v>>>0,u}}
function ev(t){let i=0;
 function un(){const k=t[i++];if(k===undefined)throw Error('Biểu thức chưa hoàn chỉnh');
  if(k=='('){const r=ex(1);if(t[i++]!=')')throw Error('Thiếu dấu )');return r}
  if(k=='~'){const r=un();return{v:~r.v>>>0,u:r.u}}
  if(k=='!')return{v:+!un().v,u:0};
  if(k=='-'){const r=un();return{v:-r.v>>>0,u:r.u}}
  if(/^\d/.test(k))return{v:Number(k.replace(/[uUlL]+$/,''))>>>0,u:/[uU]/.test(k)?1:0};
  if(k in defs)return defs[k];if(k in vars)return{v:vars[k]>>>0,u:1};
  throw Error('Chưa khai báo: '+k)}
 function ex(m){let a=un();for(;;){const o=t[i],p=P[o];if(!p||p<m)break;i++;a=bin(o,a,ex(p+1))}return a}
 const r=ex(1);if(i<t.length)throw Error('Thừa token: '+t[i]);return r}
const say=(m,c)=>{const d=document.createElement('div');d.className=c||'';d.textContent=m;$('log').appendChild(d);$('log').scrollTop=1e9};
const bitsOf=m=>{const a=[];for(let i=31;i>=0;i--)if(m>>>i&1)a.push(i);return a.join(',')||'không'};
function exec(st){let m;W=[];
 if(m=st.match(/^#\s*define\s+(\w+)\s+(.+)$/)){defs[m[1]]=ev(tok(m[2]));say('#define '+m[1]+' = 0x'+h8(defs[m[1]].v),'ok');return}
 const re=/^(?:volatile\s+)?(?:uint32_t|unsigned(?:\s+int)?|int)\s+/,d=re.test(st);st=st.replace(re,'');
 const t=tok(st),op=t[1];
 if(d&&t.length==1){vars[t[0]]=0;cur=t[0];say('khai báo '+t[0],'ok')}
 else if(t.length>2&&/^(=|\|=|&=|\^=|<<=|>>=|\+=|-=)$/.test(op)&&/^[A-Za-z_]/.test(t[0])){
  const n=t[0],r=ev(t.slice(2)),o=vars[n];
  if(o===undefined&&op!='='&&!d)W.push(n+' chưa có giá trị, coi là 0');
  const x=op=='='?r:bin(op.slice(0,-1),{v:o>>>0||0,u:1},r);
  vars[n]=x.v>>>0;mask=((o||0)^x.v)>>>0;cur=n;
  say(st+'  →  '+n+' = 0x'+h8(x.v)+'   (bit đổi: '+bitsOf(mask)+')','ok')}
 else{const r=ev(t);say(st+'  →  0x'+h8(r.v)+' = '+r.v,'ok')}
 W.forEach(w=>say('⚠ '+w,'wr'))}
function prog(){const src=$('code').value.replace(/\/\*[\s\S]*?\*\//g,'').replace(/\/\/.*$/gm,'');const o=[];
 src.split('\n').forEach(l=>{l=l.trim();if(!l)return;if(l[0]=='#')o.push(l);else l.split(';').forEach(s=>{s=s.trim();if(s)o.push(s)})});return o}
function safe(s){try{exec(s)}catch(e){say('Lỗi: '+s+' → '+e.message,'er')}}
function init(){vars={...PRE};defs={};const c=CH[+$('ch').value];if(c){vars[c.r]=c.s>>>0;cur=c.r}else cur='REG';mask=0;step=0;$('log').innerHTML=''}
function check(){const c=CH[+$('ch').value];if(c&&(vars[c.r]>>>0)===(c.g>>>0))say('✓ Đúng mục tiêu '+c.r+' = 0x'+h8(c.g),'ok')}
function runAll(){init();prog().forEach(safe);check();draw()}
function stepOne(){if(!step)init();const l=prog();if(step>=l.length){say('Hết chương trình.');return}say('['+(step+1)+'/'+l.length+']');safe(l[step++]);if(step==l.length)check();draw()}
function tg(i){vars[cur]=(vars[cur]^(1<<i))>>>0;mask=1<<i>>>0;draw()}
function pick(){const c=CH[+$('ch').value];init();$('hint').textContent=c?'Gợi ý: '+c.h:'';
 $('code').value=c?'// Mục tiêu: '+c.r+' = 0x'+h8(c.g)+'\n// Giá trị đầu: 0x'+h8(c.s)+'\n':'REG |= (1U << 0);\nREG |= (1U << 6);\nREG &= ~(0x3U << (13 * 2));\nREG |= (0x1U << (13 * 2));\nREG ^= (1U << 14);';draw()}
function draw(){const v=(vars[cur]||0)>>>0,c=CH[+$('ch').value];
 $('sel').innerHTML=Object.keys(vars).map(k=>'<option value="'+esc(k)+'"'+(k==cur?' selected':'')+'>'+esc(k)+'</option>').join('');
 $('hex').textContent='0x'+h8(v);$('bin').textContent=v.toString(2).padStart(32,'0').replace(/(.{4})(?!$)/g,'$1 ');$('dec').textContent=v.toLocaleString();
 let a='',b='';for(let i=31;i>=0;i--){const on=v>>>i&1;a+='<div class="h">'+i+'</div>';b+='<div class="b'+(on?' on':'')+((mask>>>i&1)?' chg':'')+'" onclick="tg('+i+')">'+on+'</div>'}
 $('hd').innerHTML=a;$('bits').innerHTML=b;
 let f='';if($('f2').checked)for(let p=15;p>=0;p--){const x=v>>>(2*p)&3;f+='<div class="f'+((mask>>>(2*p)&3)?' chg':'')+'">P'+p+': '+['IN','OUT','AF','AN'][x]+'</div>'}
 $('fl').innerHTML=f;$('fl').style.display=f?'grid':'none';
 $('tg').textContent=c&&c.r==cur?'Mục tiêu: 0x'+h8(c.g)+'  |  Hiện tại: 0x'+h8(v)+(v===(c.g>>>0)?'  ✓':''):''}
$('ch').innerHTML='<option value="-1">Tự do</option>'+CH.map((c,i)=>'<option value="'+i+'">'+esc(c.t)+'</option>').join('');
$('sn').innerHTML=SN.map((s,i)=>'<button onclick="$(\'ch\').value=-1;init();$(\'code\').value=SN['+i+'][1];draw()">'+esc(s[0])+'</button>').join('');
pick();
</script>
</body>
</html>
